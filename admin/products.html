<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURUM Admin</title>
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="../styles/admin.css">
</head>
<body class="admin-body">
  <div class="admin">
    <aside id="sidebar"></aside>
    <div class="admin-main">
      <header id="admin-top"></header>
      <main class="admin-content" id="page">
        <div class="toolbar">
          <input class="input grow" id="search" type="search" placeholder="Tìm theo tên hoặc mã sản phẩm...">
          <select class="select" id="f-cat"></select>
          <select class="select" id="f-stock">
            <option value="">Tất cả tồn kho</option>
            <option value="in">Còn hàng</option>
            <option value="low">Sắp hết (&lt; 50)</option>
            <option value="out">Hết hàng</option>
          </select>
          <select class="select" id="f-sort">
            <option value="new">Mới thêm</option>
            <option value="name">Tên A → Z</option>
            <option value="price-asc">Giá tăng</option>
            <option value="price-desc">Giá giảm</option>
            <option value="stock">Tồn kho ít nhất</option>
          </select>
          <button class="btn btn-gold" id="btn-add">+ Thêm sản phẩm</button>
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Sản phẩm</th><th>Danh mục</th><th class="num">Giá bán</th><th>Màu / Size</th><th class="num">Tồn kho</th><th class="num">Đã bán</th><th>Trạng thái</th><th class="center">SEO</th><th class="num">Thao tác</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="table-foot" id="foot"></div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="js/products.js"></script>
</body>
</html>
