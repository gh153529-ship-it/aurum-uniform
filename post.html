<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài viết – AURUM Uniform</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container" id="post-root">
    <div class="post-layout">
      <article class="post-article">
        <div class="crumbs" id="crumbs"></div>
        <h1 id="p-title"></h1>
        <div class="post-meta" id="p-meta"></div>
        <div id="p-cover"></div>
        <p class="post-lead" id="p-summary"></p>
        <div class="post-content" id="p-content"></div>
        <div id="p-tags"></div>
        <div id="p-share"></div>
      </article>
      <aside class="post-aside">
        <div class="aside-box">
          <h4>Bài viết mới</h4>
          <div id="p-recent"></div>
        </div>
        <div class="aside-box aside-cta">
          <h4>Cần tư vấn đồng phục?</h4>
          <p>Gọi <b>1900 6868</b> hoặc xem bảng giá sỉ – giảm đến 15% cho đơn từ 100 áo.</p>
          <a href="products.html" class="btn btn-gold btn-block">Xem sản phẩm</a>
        </div>
      </aside>
    </div>

    <section class="section">
      <div class="section-head"><div><span class="eyebrow">Gợi ý</span><h2 class="section-title">Sản phẩm nổi bật</h2></div></div>
      <div class="product-grid" id="p-products"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="js/pages/post.js"></script>
</body>
</html>
