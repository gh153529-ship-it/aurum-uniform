<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh toán – AURUM Uniform</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <header id="site-header"></header>

  <section class="page-banner">
    <div class="container">
      <div class="crumbs"><a href="index.html">Trang chủ</a><span>/</span><a href="cart.html">Giỏ hàng</a><span>/</span>Thanh toán</div>
      <h1>Thanh toán</h1>
      <div class="steps-bar">
        <div class="on" data-n="1">Giỏ hàng</div>
        <div class="on" data-n="2">Thanh toán</div>
        <div data-n="3">Hoàn tất</div>
      </div>
    </div>
  </section>

  <main class="container">
    <form class="cart-layout" id="checkout-form" novalidate>
      <div style="display:grid; gap:24px">
        <section class="box">
          <h3>Thông tin người nhận</h3>
          <p class="muted" id="login-hint" style="font-size:14px; margin-top:-4px"></p>
          <div class="form-grid">
            <div class="form-grid two">
              <div class="field">
                <label for="c-name">Họ tên / Công ty <span class="req">*</span></label>
                <input class="input" id="c-name" autocomplete="name">
              </div>
              <div class="field">
                <label for="c-phone">Số điện thoại <span class="req">*</span></label>
                <input class="input" id="c-phone" type="tel" autocomplete="tel">
              </div>
            </div>
            <div class="field">
              <label for="c-email">Email <span class="req">*</span></label>
              <input class="input" id="c-email" type="email" autocomplete="email">
            </div>
            <div class="form-grid two">
              <div class="field">
                <label for="c-province">Tỉnh / Thành phố <span class="req">*</span></label>
                <select class="select" id="c-province"></select>
              </div>
              <div class="field">
                <label for="c-ward">Phường / Xã <span class="req">*</span></label>
                <input class="input" id="c-ward" placeholder="VD: Phường Bến Nghé">
              </div>
            </div>
            <div class="field">
              <label for="c-address">Địa chỉ chi tiết <span class="req">*</span></label>
              <input class="input" id="c-address" placeholder="Số nhà, tên đường, toà nhà..." autocomplete="street-address">
            </div>
            <div class="field">
              <label for="c-note">Ghi chú đơn hàng</label>
              <textarea class="input" id="c-note" rows="3" placeholder="VD: Giao giờ hành chính, cần xuất hoá đơn VAT, gửi mẫu thiết kế trước khi in..."></textarea>
            </div>
            <label class="check"><input type="checkbox" id="c-vat"> Yêu cầu xuất hoá đơn VAT cho doanh nghiệp</label>
            <div class="form-grid two hidden" id="vat-fields">
              <div class="field"><label for="c-taxcode">Mã số thuế <span class="req">*</span></label><input class="input" id="c-taxcode"></div>
              <div class="field"><label for="c-company">Tên công ty <span class="req">*</span></label><input class="input" id="c-company"></div>
            </div>
          </div>
        </section>

        <section class="box">
          <h3>Phương thức thanh toán</h3>
          <div class="pay-options">
            <label class="pay-opt">
              <input type="radio" name="payment" value="cod" checked>
              <div><b>💵 Thanh toán khi nhận hàng (COD)</b><small>Kiểm tra hàng rồi thanh toán cho nhân viên giao hàng.</small></div>
            </label>
            <label class="pay-opt">
              <input type="radio" name="payment" value="bank">
              <div><b>🏦 Chuyển khoản ngân hàng</b><small>Đơn được xử lý ngay khi nhận được thanh toán.</small>
                <div class="pay-extra hidden" data-extra="bank" id="bank-info"></div>
              </div>
            </label>
            <label class="pay-opt">
              <input type="radio" name="payment" value="ewallet">
              <div><b>📱 Ví điện tử MoMo / ZaloPay</b><small>Quét mã QR để thanh toán (minh hoạ).</small>
                <div class="pay-extra hidden" data-extra="ewallet">Sau khi đặt hàng, mã QR thanh toán sẽ được gửi qua email và tin nhắn.</div>
              </div>
            </label>
          </div>
        </section>
      </div>

      <aside class="box" style="position:sticky; top:130px">
        <h3>Đơn hàng (<span id="co-qty">0</span> áo)</h3>
        <div class="mini-items" id="co-items"></div>
        <div class="coupon">
          <input class="input" id="coupon" placeholder="Mã giảm giá">
          <button type="button" class="btn btn-outline btn-sm" id="btn-coupon">Áp dụng</button>
        </div>
        <div id="co-summary"></div>
        <label class="check" style="margin-top:14px; font-size:13px"><input type="checkbox" id="c-agree" checked> Tôi đồng ý với chính sách đổi trả & bảo hành</label>
        <button type="submit" class="btn btn-gold btn-block" style="margin-top:14px">Đặt hàng</button>
        <a href="cart.html" class="btn btn-block" style="margin-top:6px">← Quay lại giỏ hàng</a>
      </aside>
    </form>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="js/pages/checkout.js"></script>
</body>
</html>
